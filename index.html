<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>छठ गीत</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Yatra+One&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       body {
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: #0c0c0c;
    
    /* Updated to use the Raw GitHub URL */
    background-image: url('https://raw.githubusercontent.com/yashwantk2936-arch/chhath/main/ChatGPT%20Image%20Aug%2012%2C%202026%2C%2002_27_21%20PM.png');
    
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 0.8s ease-in-out;
    color: #fff;
}

        /* Aesthetic Dark Gradient Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        /* Top Corner Action: Change Background */
        .corner-action {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 0.85rem;
            color: #d1d1d1;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: rgba(255, 215, 0, 0.5);
        }

        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Top Section: Title & Song Selection */
        .header-section {
            width: 100%;
            text-align: center;
            padding-top: 10vh;
            z-index: 1;
        }

        h1 {
            font-family: 'Yatra One', cursive; 
            font-size: 5.5rem;
            margin-bottom: 0;
            color: #fcebbb; /* Soft aesthetic gold */
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
            letter-spacing: 2px;
            font-weight: normal;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 40px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Preloaded Songs & Upload Options */
        .playlist-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .song-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #ccc;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .song-chip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .song-chip.active {
            background: rgba(252, 235, 187, 0.15);
            border-color: #fcebbb;
            color: #fcebbb;
        }

        /* Hide Default File Inputs */
        input[type="file"] {
            display: none;
        }

        /* Floating Bottom Bar (Highly Transparent) */
        .bottom-bar {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 24px;
            padding: 25px 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Track Info */
        .track-info {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }

        /* Progress Area */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.75rem;
            color: #aaa;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            transition: background 0.3s;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fcebbb;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(252, 235, 187, 0.5);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Controls Area */
        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            flex-grow: 1;
        }

        .control-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .control-btn svg {
            width: 24px;
            height: 24px;
        }

        .control-btn:hover {
            color: #fcebbb;
        }

        .play-pause-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            color: #fcebbb;
        }

        .play-pause-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .play-pause-btn:hover {
            background: rgba(252, 235, 187, 0.15);
            transform: scale(1.05);
        }

        /* Volume Controls */
        .volume-area {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 120px;
            color: #aaa;
        }

        .volume-area svg {
            width: 18px;
            height: 18px;
        }

        .volume-area input[type="range"] {
            width: 100%;
        }
        
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Background Overlay -->
    <div class="overlay"></div>

    <!-- Top Right Corner: Background Upload -->
    <div class="corner-action">
        <label for="bg-upload" class="action-btn">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            Background
        </label>
        <input type="file" id="bg-upload" accept="image/*">
    </div>

    <!-- Header & Song Selection -->
    <div class="header-section">
        <h1>छठ गीत</h1>
        <p class="subtitle">Devotional Chhath Vibes</p>

        <div class="playlist-container" id="playlist-container">
            <!-- Preloaded Songs -->
        <div class="song-chip" data-src="https://raw.githubusercontent.com/yashwantk2936-arch/chhath/main/%E0%A4%9B%E0%A4%A0%20%E0%A4%AE%E0%A4%88%20%E0%A4%95%20%E0%A4%AE%E0%A4%B9%E0%A4%AE%20%E0%A4%85%E0%A4%AA%E0%A4%B0%20%20Pawan%20Singh%20Hit%20Chhath%20Pooja%20Geet%20-%20Jukebox%20%20Bhojpuri%20Sadabahar%20Chhath%20Geet_compressed.mp3">
    <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    Pawan Singh Chhath Geet
</div>
          <div class="song-chip" data-src="https://raw.githubusercontent.com/yashwantk2936-arch/chhath/main/BEST%20OF%20ANURADHA%20PAUDWAL%20%26%20KAVITA%20PAUDWAL%20CHHATH%20SONGS%20(chhat%20song%20)_compressed_compressed_compressed%20(2).mp3">
    <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    Anuradha Paudwal Chhath Geet
</div>
            </div>
            <div class="song-chip" data-src="https://raw.githubusercontent.com/yashwantk2936-arch/chhath/main/CHHATHI%20MAIYA%20BEST%20OF%20SHARDA%20SINHA%20CHHATH%20SONGS%20VIDEO%20JUKEBOX%20T-Series%20Hamaar%20Bhojpuri_compressed.mp3">
    <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    Sharda Sinha Chhath Geet
</div>
          

            <!-- Divider/Separator in flex -->
            <div style="width: 100%; height: 5px;"></div>

            <!-- Upload Custom Song -->
            <label for="audio-upload" class="song-chip" style="border-style: dashed;">
                <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Upload Audio
            </label>
            <input type="file" id="audio-upload" accept="audio/*">
        </div>
    </div>

    <audio id="audio-player"></audio>

    <!-- Transparent Bottom Player Bar -->
    <div class="bottom-bar">
        <div class="track-info" id="track-name">Select a track to begin</div>
        
        <!-- Progress -->
        <div class="progress-area">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <span id="duration-time">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls-area">
            <!-- Spacer for centering main controls -->
            <div style="width: 120px;"></div> 

            <div class="main-controls">
                <button class="control-btn" id="prev-btn">
                    <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                </button>
                <button class="control-btn" id="rewind-btn">
                    <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
                </button>
                <button class="control-btn play-pause-btn" id="play-pause-btn">
                    <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <button class="control-btn" id="forward-btn">
                    <svg viewBox="0 0 24 24"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
                </button>
                <button class="control-btn" id="next-btn">
                    <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                </button>
            </div>

            <!-- Volume -->
            <div class="volume-area">
                <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <input type="range" id="volume-bar" value="1" min="0" max="1" step="0.01">
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const audio = document.getElementById('audio-player');
        const audioUpload = document.getElementById('audio-upload');
        const bgUpload = document.getElementById('bg-upload');
        const songChips = document.querySelectorAll('.song-chip[data-src]');
        
        // UI Elements
        const trackName = document.getElementById('track-name');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const volumeBar = document.getElementById('volume-bar');

        let currentSongIndex = -1;
        let isCustomAudio = false;

        const formatTime = (time) => {
            if (isNaN(time)) return "0:00";
            const minutes = Math.floor(time / 60);
            const seconds = Math.floor(time % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        };

        const updatePlayState = (playing) => {
            if (playing) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        };

        const setActiveChip = (index) => {
            songChips.forEach((chip, i) => {
                if (i === index) chip.classList.add('active');
                else chip.classList.remove('active');
            });
        };

        const playSong = (index) => {
            if (index < 0 || index >= songChips.length) return;
            currentSongIndex = index;
            isCustomAudio = false;
            
            const chip = songChips[index];
            audio.src = chip.getAttribute('data-src');
            trackName.textContent = chip.textContent.trim();
            
            setActiveChip(index);
            updatePlayState(true);
        };

        // Click Preloaded Songs
        songChips.forEach((chip, index) => {
            chip.addEventListener('click', () => {
                playSong(index);
            });
        });

        // Play/Pause Button
        document.getElementById('play-pause-btn').addEventListener('click', () => {
            if (!audio.src) return;
            updatePlayState(audio.paused);
        });

        // Forward & Rewind
        document.getElementById('forward-btn').addEventListener('click', () => { audio.currentTime += 10; });
        document.getElementById('rewind-btn').addEventListener('click', () => { audio.currentTime -= 10; });

        // Next & Prev
        document.getElementById('next-btn').addEventListener('click', () => {
            if (isCustomAudio) return;
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= songChips.length) nextIndex = 0;
            playSong(nextIndex);
        });
        
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (isCustomAudio) return;
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = songChips.length - 1;
            playSong(prevIndex);
        });

        // Volume
        volumeBar.addEventListener('input', (e) => { audio.volume = e.target.value; });

        // Progress Bar Update
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audio.duration);
        });

        progressBar.addEventListener('input', (e) => {
            audio.currentTime = (e.target.value / 100) * audio.duration;
        });

        audio.addEventListener('ended', () => {
            if (!isCustomAudio && songChips.length > 0) {
                document.getElementById('next-btn').click();
            } else {
                updatePlayState(false);
                progressBar.value = 0;
                audio.currentTime = 0;
            }
        });

        // Upload Custom Audio
        audioUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                isCustomAudio = true;
                currentSongIndex = -1;
                setActiveChip(-1); // Remove active state from chips
                
                audio.src = URL.createObjectURL(file);
                trackName.textContent = file.name;
                updatePlayState(true);
            }
        });

        // Upload Background
        bgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.body.style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
            }
        });
    </script>
</body>
</html>
